<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Real-Time Chat</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<div class="container">


    <h1>Real-Time Chat</h1>


    <!-- AUTH SECTION -->

    <div id="auth-section">

        <h2>Login / Register</h2>


        <input
            id="username"
            type="text"
            placeholder="Username"
        >


        <input
            id="password"
            type="password"
            placeholder="Password"
        >


        <div class="buttons">

            <button onclick="register()">
                Register
            </button>


            <button onclick="login()">
                Login
            </button>

        </div>


        <p id="auth-message"></p>

    </div>


    <!-- CHAT SECTION -->

    <div
        id="chat-section"
        class="hidden"
    >

        <div class="room-controls">

            <select id="room">

                <option value="general">
                    General
                </option>

                <option value="backend">
                    Backend
                </option>

                <option value="python">
                    Python
                </option>

            </select>


            <button onclick="connect()">
                Join Room
            </button>

        </div>


        <h3 id="room-title">
            Select a room
        </h3>


        <div
            id="messages"
            class="messages"
        ></div>


        <div class="input-area">

            <input
                id="message"
                type="text"
                placeholder="Type a message..."
                onkeydown="handleEnter(event)"
            >


            <button onclick="sendMessage()">
                Send
            </button>

        </div>


        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


</div>


<script src="script.js"></script>


</body>

</html>
